<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoStream - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        html, body { height: 100%; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #111827;
        }
        .tab-active {
            border-bottom: 2px solid #3b82f6;
            color: white;
        }
    </style>
</head>
<body>

<!-- Logo centrado arriba del formulario -->
<div class="absolute top-8 left-1/2 transform -translate-x-1/2 flex items-center">
    <span style="display:inline-block; width:52px; height:52px; border-radius:50%; background: linear-gradient(135deg, #323470 75%, #3f2a71 50%); box-shadow: 0 2px 8px rgba(13, 10, 54, 0.3); position:relative;">
        <svg width="52" height="52" viewBox="0 0 52 52" style="position:absolute; top:0; left:0;">
            <polygon points="21,16 40,26 21,36" fill="#341c6c" opacity="0.9"/>
        </svg>
    </span>
    <span class="text-3xl font-bold text-white ml-4" style="letter-spacing:-0.5px;">CryptoStream</span>
</div>

<div class="w-full max-w-sm p-8 bg-gray-800 rounded-lg shadow-lg">

    <!-- Tabs -->
    <div class="flex justify-around mb-6">
        <button id="btn-login" class="tab-active text-indigo-300 font-bold pb-2">Iniciar Sesión</button>
        <button id="btn-register" class="text-indigo-400 font-bold pb-2">Registrarse</button>
    </div>

    <!-- FORMULARIO -->
    <form id="auth-form" class="space-y-6">

        <div>
            <label class="block text-sm text-gray-300 mb-1">Usuario</label>
            <input id="username" type="text"
                class="w-full px-3 py-2 bg-gray-700 text-white rounded border border-gray-600">
        </div>

        <div>
            <label class="block text-sm text-gray-300 mb-1">Contraseña</label>
            <input id="password" type="password"
                class="w-full px-3 py-2 bg-gray-700 text-white rounded border border-gray-600">
            <p id="pw-help" class="text-xs text-gray-400 mt-1">La contraseña debe tener al menos 8 caracteres, incluir una letra mayúscula y un número.</p>
        </div>

        <!-- Campo de llave privada visible desde el inicio en modo login -->
        <div id="private-key-container" class="hidden">
            <label class="block text-sm text-gray-300 mb-1">Llave Privada (.pem)</label>
            <input id="private-key-file" type="file" accept=".pem"
                class="w-full text-sm text-gray-400 cursor-pointer
                       file:mr-4 file:py-2 file:px-4
                       file:rounded-lg file:border-0 file:font-semibold
                       file:bg-blue-600 file:text-white
                       hover:file:bg-blue-700 file:cursor-pointer">
        </div>

        <button id="submit-btn" type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg">
            Entrar
        </button>

        <p id="status-msg" class="text-center text-sm mt-3"></p>
    </form>

</div>

<!-- Configuración y Crypto E2EE -->
<script src="config.js"></script>
<script src="frontend.js"></script>
<script>
    // Comprobar si hay mensaje de registro persistente
    const savedRegMsg = localStorage.getItem('registrationMessage');
    let mode = savedRegMsg ? 'register' : 'login';
    let isSuccessfulRegistration = !!savedRegMsg;

    const btnLogin = document.getElementById("btn-login");
    const btnRegister = document.getElementById("btn-register");
    const form = document.getElementById("auth-form");
    const statusMsg = document.getElementById("status-msg");
    const submitBtn = document.getElementById("submit-btn");
    const pwHelp = document.getElementById('pw-help');

    function updateTabsUI() {
        if (mode === "login") {
            btnLogin.classList.add("tab-active");
            btnRegister.classList.remove("tab-active");
            submitBtn.textContent = "Entrar";
            if (pwHelp) pwHelp.style.display = 'none';
            // Mostrar campo de llave privada en login
            document.getElementById('private-key-container').classList.remove('hidden');
        } else {
            btnRegister.classList.add("tab-active");
            btnLogin.classList.remove("tab-active");
            submitBtn.textContent = "Registrarse";
            if (pwHelp) pwHelp.style.display = 'block';
            // Ocultar campo de llave privada en registro
            document.getElementById('private-key-container').classList.add('hidden');
        }
    }

    // Inicializar UI
    updateTabsUI();

    // Si hay mensaje de registro guardado, mostrarlo y luego eliminarlo
    if (savedRegMsg) {
        statusMsg.textContent = savedRegMsg;
        statusMsg.className = 'text-green-400 text-center text-sm mt-3';
        // Limpiar el mensaje de localStorage para que no persista en futuras visitas
        localStorage.removeItem('registrationMessage');
    }

    // --------- CAMBIO DE TABS ---------
    btnLogin.addEventListener("click", () => {
        console.log("Click en LOGIN - limpiando formulario y mensaje");
        mode = "login";
        updateTabsUI();
        // Limpiar formulario completo
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
        document.getElementById("private-key-file").value = "";
        // Limpiar mensajes
        statusMsg.textContent = "";
        statusMsg.className = "";
        localStorage.removeItem('registrationMessage');
    });

    btnRegister.addEventListener("click", () => {
        console.log("Click en REGISTER - limpiando formulario");
        mode = "register";
        updateTabsUI();
        // Limpiar formulario completo
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
        document.getElementById("private-key-file").value = "";
        // Limpiar mensajes
        statusMsg.textContent = "";
        statusMsg.className = "";
        localStorage.removeItem('registrationMessage');
    });

    // --------- MANEJAR EL FORMULARIO ---------
    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();

        // Deshabilitar botón y mostrar indicador mientras se procesa
        const originalBtnText = submitBtn.textContent;
        submitBtn.disabled = true;
        submitBtn.textContent = mode === 'register' ? 'Registrando...' : 'Autenticando...';

        if (!username || !password) {
            statusMsg.textContent = "Todos los campos son obligatorios.";
            statusMsg.className = "text-red-400 text-center text-sm mt-3";
            // Reactivar botón
            submitBtn.disabled = false;
            submitBtn.textContent = originalBtnText;
            return;
        }

        // --- MODO REGISTRO ---
        if (mode === "register") {
            console.log("Iniciando proceso de REGISTRO");
            // Validación del lado del cliente: 8+ caracteres, al menos una mayúscula y un número
            const pw = password;
            if (pw.length < 8) {
                statusMsg.textContent = 'La contraseña debe tener al menos 8 caracteres.';
                statusMsg.className = 'text-red-400 text-center text-sm mt-3';
                submitBtn.disabled = false;
                submitBtn.textContent = originalBtnText;
                return;
            }
            const pattern = /(?=.*[A-Z])(?=.*\d)/;
            if (!pattern.test(pw)) {
                statusMsg.textContent = 'La contraseña debe incluir al menos una letra mayúscula y un número.';
                statusMsg.className = 'text-red-400 text-center text-sm mt-3';
                submitBtn.disabled = false;
                submitBtn.textContent = originalBtnText;
                return;
            }
            try {
                // Generar llaves
                const { publicKey, privateKey } = await E2EE.generateRSAKeyPair();
                const publicKeyPem = await E2EE.exportPublicKeyPem(publicKey);
                const privateKeyPem = await E2EE.exportPrivateKeyPem(privateKey);
                
                // Hashear contraseña
                const passwordHash = await E2EE.pbkdf2Hash(password, username);
                
                // Registrar en el servidor
                const resp = await fetch(`${window.API_BASE_URL || 'http://localhost:3000'}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, passwordHash, publicKeyPem })
                });
                
                if (!resp.ok) throw new Error('Error en registro');
                
                // Función auxiliar para descargar archivo
                const downloadFile = (content, filename, type) => {
                    const blob = new Blob([content], { type });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                };
                
                // Descargar llaves inmediatamente (sin almacenar en memoria)
                // Primero la privada (más importante)
                downloadFile(privateKeyPem, `${username}_private.pem`, 'application/x-pem-file');
                
                // Pequeño delay para evitar que el navegador bloquee la segunda descarga
                await new Promise(resolve => setTimeout(resolve, 200));
                
                // Luego la pública
                downloadFile(publicKeyPem, `${username}_public.pem`, 'application/x-pem-file');
                
                console.log('✓ Llaves descargadas:', `${username}_private.pem`, `${username}_public.pem`);
                
                // Limpiar variables de llaves de la memoria inmediatamente
                // (las variables locales se eliminarán cuando salga del scope)
                
                // Mostrar mensajes: éxito + advertencia crítica
                statusMsg.innerHTML = "<span class=\"text-green-400\">✓ Llaves guardadas exitosamente.</span><br>" +
                    "<span class=\"text-red-400\">Advertencia: Guarda tu llave privada en un lugar seguro. Si la pierdes, pierdes tu cuenta y tus videos.</span>";
                statusMsg.className = "text-center text-sm mt-3";
                
                // Limpiar formulario
                document.getElementById("username").value = "";
                document.getElementById("password").value = "";
                
                // Mantener al usuario en la pestaña de registro y persistir mensaje temporalmente
                mode = "register";
                localStorage.setItem('registrationMessage', 'Llaves guardadas exitosamente. Guarda tu llave privada en un lugar seguro.');
                updateTabsUI();

                // Eliminar el mensaje de registro inmediatamente después de mostrarlo
                setTimeout(() => {
                    localStorage.removeItem('registrationMessage');
                }, 0);
                
                // Reactivar botón
                submitBtn.disabled = false;
                submitBtn.textContent = originalBtnText;
                
            } catch (err) {
                console.log("Error de conexión:", err);
                isSuccessfulRegistration = false;
                localStorage.removeItem('registrationMessage');
                statusMsg.textContent = "Error de conexión al registrar.";
                statusMsg.className = "text-red-400 text-center text-sm mt-3";
                submitBtn.disabled = false;
                submitBtn.textContent = originalBtnText;
            }

            return;
        }

        // --- MODO LOGIN ---
        if (mode === "login") {
            try {
                // Verificar que se haya cargado la llave privada
                const pkFile = document.getElementById('private-key-file').files[0];
                if (!pkFile) {
                    statusMsg.textContent = 'Por favor selecciona tu archivo de llave privada (.pem)';
                    statusMsg.className = 'text-yellow-300 text-center text-sm mt-3';
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalBtnText;
                    return;
                }
                
                const pem = await pkFile.text();
                const nonceB64 = await E2EE.loginStart(username, password);
                const token = await E2EE.loginFinish(username, nonceB64, pem);
                
                localStorage.setItem("jwt", token);
                localStorage.setItem("username", username);

                document.getElementById("username").value = "";
                document.getElementById("password").value = "";
                document.getElementById("private-key-file").value = "";
                statusMsg.textContent = "";
                statusMsg.className = "";
                localStorage.removeItem('registrationMessage');
                submitBtn.disabled = false;
                submitBtn.textContent = originalBtnText;
                try { sessionStorage.setItem('activeSection', 'watch'); } catch (e) {}
                window.location.replace("index.html");
            } catch (err) {
                statusMsg.textContent = "Error al iniciar sesión. Verifica tus credenciales y llave privada.";
                statusMsg.className = "text-red-400 text-center text-sm mt-3";
                submitBtn.disabled = false;
                submitBtn.textContent = originalBtnText;
            }
        }
    });
</script>

<!-- Scripts al final del body -->

</body>
</html>
